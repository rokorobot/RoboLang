[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robolang"
# Distribution version: the maturity of this package (a pre-release).
# It is independent of the language version (1.1) and the IR schema
# version (1.0), which are defined in src/robolang/.
version = "0.1.0a1"
description = "RoboLang: a task description language for robots, with a parser, validator and simulation-only task execution."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Robert Konecny" }]
keywords = ["robotics", "dsl", "task-language", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
]
# No runtime dependencies. In particular there is no dependency on rclpy:
# ROS 2 Python packages are not distributed on PyPI.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2", "jsonschema>=4.18"]

[project.urls]
Repository = "https://github.com/rokorobot/RoboLang"
Documentation = "https://rokorobot.github.io/RoboLang/"
Issues = "https://github.com/rokorobot/RoboLang/issues"

[project.scripts]
# The only installed command. Read-only: `robolang validate FILE`, `robolang inspect FILE`.
#
# The original setup.py also defined `ros2_runtime = robolang_ros2_main:main`.
# It is deliberately NOT installed: it leads to the v1 interpreter and the
# unvalidated ROS 2 adapter, which do not pass through the static validator.
# Do not add an execution command here without an explicit owner decision.
robolang = "robolang.cli:run"

[tool.setuptools]
package-dir = { "" = "src" }
# The installed distribution is the `robolang` package, its simulation-only
# `robolang.sim` subpackage, the `robolang.core` Core 0.1 document checks and the
# simulation-only `robolang.arch02` reference scenario (no adapter, no ROS 2, no network).
#
# The v1 prototype in src/ (robolang_runtime, robolang_adapter,
# robolang_adapter_ros2, robolang_ros2_main) is historical source kept in the
# repository. It is deliberately NOT installed: it can drive ROS 2 without
# passing through the validator. Do not add `py-modules` here without an
# explicit owner decision.
packages = ["robolang", "robolang.sim", "robolang.core", "robolang.arch02"]

[tool.setuptools.package-data]
# Copies of spec/core/*.schema.json; tests/test_core.py checks they are identical.
"robolang.core" = ["schemas/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
