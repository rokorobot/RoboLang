# ros2_control controllers for the simulated UR5e (phase 1).
# The stock ur_simulation_gz 2.5.0 config on Lyrical declares ur_controllers/ScaledJointTrajectoryController, which the
# controller manager cannot load there, and has no parameters for joint_trajectory_controller. This file replaces it.
controller_manager:
  ros__parameters:
    update_rate: 1000 # Hz, equal to the 1 ms physics step

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 2.0
