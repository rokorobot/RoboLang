name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - run: python -m pytest -q
      - name: Simulated demo
        run: python legacy/robolang_runtime.py examples/pick_and_place.rob
      - name: Build, install into clean environments and run the installed CLI
        run: python tools/smoke_install.py
