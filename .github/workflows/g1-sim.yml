name: G1 simulation harness

# Decision 0046, phases 1-3: the Unitree G1 stand-in in MuJoCo and the checks P1-P6, the executor's checks E1-E7, then the
# verdict checks O1-O7 (goal and precondition verdicts from observations) (backends/unitree_g1). On demand and nightly, and on pull requests that change the backend or this workflow (so x86_64
# is checked before a backend change merges). 05:11 UTC is clear of the benchmark (Monday 06:00) and the ROS 2 harness
# (03:17). The phase 2 and 3 checks run in simulated real time (the stand-in is paced to the wall clock, 0046 U13): about
# half an hour each on four cores, so the job's limit is 170 minutes.
on:
  pull_request:
    paths:
      - "backends/unitree_g1/**"
      - ".github/workflows/g1-sim.yml"
  workflow_dispatch:
    inputs:
      stance:
        description: "what the robot does when it stands still"
        type: choice
        options: [free, supported]
        default: free
  schedule:
    - cron: "11 5 * * *"

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      G1_ASSETS: ${{ github.workspace }}/.g1-assets
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: System packages (software OpenGL through EGL, a C toolchain for CycloneDDS)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential python3-dev \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglu1-mesa libgles2 libosmesa6
      - name: Cache the assets (models, policy, SDK, CycloneDDS build), keyed on the fetch script
        uses: actions/cache@v6
        with:
          path: .g1-assets
          key: g1-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backends/unitree_g1/scripts/fetch_assets.sh') }}
      - name: Install robolang, fetch the assets, install the backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          bash backends/unitree_g1/scripts/fetch_assets.sh
          python -m pip install -e "backends/unitree_g1[test]"
      - name: Backend tests
        run: python -m pytest -q backends/unitree_g1/tests
      - name: Harness (P1-P6)
        run: python -m robolang_g1.harness --stance "${{ inputs.stance || 'free' }}" --out out/harness.json
      - name: Executor checks (E1-E7)
        run: python -m robolang_g1.phase2 --stance "${{ inputs.stance || 'free' }}" --out out/phase2.json
      - name: Verdict checks (O1-O7)
        run: python -m robolang_g1.phase3 --stance "${{ inputs.stance || 'free' }}" --out out/phase3.json
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          q = pathlib.Path("out/phase2.json")
          if q.exists():
              e = json.loads(q.read_text())
              print(f"### Phase 2 (executor): go **{e.get('go')}**, stance `{e['stance_model']}`, arch `{e['arch']}`, "
                    f"realtime_valid in every run: `{e.get('realtime_valid_all_runs')}`\n")
              for name, c in e["checks"].items():
                  print(f"- {name}: {'pass' if c['pass'] else '**FAIL**'}")
              for r in e.get("runs", []):
                  print(f"  - `{r['scenario']}`: realtime_valid `{r['realtime_valid']}`, worst second `{r['worst_second_ratio']}`, "
                        f"step compute ms `{r['step_compute_ms']}`, gc max ms `{r['gc']}`, camera `{r.get('camera')}`")
                  if r.get("slow_windows"):  # (sim time, ratio, loop thread CPU s, loop thread run-queue wait s)
                      print(f"    slow seconds (sim time, ratio, loop CPU s, loop run-queue wait s): `{r['slow_windows']}`")
              print()
          q = pathlib.Path("out/phase3.json")
          if q.exists():
              e = json.loads(q.read_text())
              print(f"### Phase 3 (verdicts): go **{e.get('go')}**, stance `{e['stance_model']}`, arch `{e['arch']}`, "
                    f"realtime_valid in every run: `{e.get('realtime_valid_all_runs')}`\n")
              for name, c in e["checks"].items():
                  print(f"- {name}: {'pass' if c['pass'] else '**FAIL**'}")
              m = e.get("robot_at_margins") or {}
              print(f"\nrobot_at: largest offset when true {m.get('largest_offset_m_when_true')} m / "
                    f"{m.get('largest_offset_rad_when_true')} rad (tolerance {m.get('tolerance_m')} m / "
                    f"{m.get('tolerance_rad')} rad)\n")
              for r in e.get("runs", []):
                  print(f"  - `{r['scenario']}`: realtime_valid `{r['realtime_valid']}`, worst second `{r['worst_second_ratio']}`, "
                        f"step compute ms `{r['step_compute_ms']}`, camera `{r.get('camera')}`")
                  if r.get("slow_windows"):  # (sim time, ratio, loop thread CPU s, loop thread run-queue wait s)
                      print(f"    slow seconds (sim time, ratio, loop CPU s, loop run-queue wait s): `{r['slow_windows']}`")
              print()
          p = pathlib.Path("out/harness.json")
          if p.exists():
              d = json.loads(p.read_text())
              print(f"stance_model: `{d['stance_model']}`, arch: `{d['arch']}`, go: **{d['go']}**\n")
              for name, c in d["checks"].items():
                  print(f"- {name}: {'pass' if c['pass'] else '**FAIL**'}")
              p6 = d["checks"].get("P6", {}).get("details", {})
              st = p6.get("stand_in") or {}
              print(f"\nrealtime_valid (U13): `{p6.get('realtime_valid')}`, worst second `{st.get('worst_second_ratio')}`, "
                    f"stalls `{st.get('stalls')}`, step compute ms `{st.get('step_compute_ms')}`")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g1-harness
          # harness.json, phase2.json, phase3.json, and every phase 2 and 3 run's record, log and stand-in log (not the frames)
          path: |
            out/harness.json
            out/phase2.json
            out/phase2.run/**/*.json
            out/phase2.run/**/*.log
            out/phase2.run/**/*.rob
            out/phase3.json
            out/phase3.run/**/*.json
            out/phase3.run/**/*.log
            out/phase3.run/**/*.rob
          if-no-files-found: warn
