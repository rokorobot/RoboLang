name: ros2-probe
on:
  workflow_dispatch:
  push:
    branches: [room/h3-phase1-harness]
jobs:
  probe:
    runs-on: ubuntu-latest
    container: ros:lyrical
    steps:
      - run: |
          apt-get update -qq
          apt-get install -y -qq ros-lyrical-ur-simulation-gz ros-lyrical-robotiq-description >/dev/null 2>&1
          d=/opt/ros/lyrical/share/ur_simulation_gz
          find $d -type f | head -50
          cat $d/launch/ur_sim_control.launch.py
          ls /opt/ros/lyrical/share/robotiq_description /opt/ros/lyrical/share/robotiq_description/*
          cat $d/config/ur_controllers.yaml | head -60
