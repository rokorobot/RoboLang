name: ROS 2 simulation harness

# H3 simulation backend (decision record 0029). On demand and nightly; not on pull requests.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (ros:lyrical, Gazebo Jetty, UR, MoveIt 2)
        run: |
          start=$(date +%s)
          docker buildx build -f backends/ros2/Dockerfile . --tag robolang-ros2-harness --load \
            --cache-from type=gha,scope=ros2-harness --cache-to type=gha,scope=ros2-harness,mode=max
          echo "image_build_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY" build_time.txt
      - name: Run smoke and RoboLang transfer (headless Gazebo)
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" robolang-ros2-harness /opt/h3/scripts/run_smoke.sh
      - name: Summary
        if: always()
        run: |
          cp build_time.txt out/ 2>/dev/null || true
          { echo '```json'; cat out/smoke.json 2>/dev/null || true; echo '```'; echo '```json'; cat out/executor.json 2>/dev/null || true; echo '```'; echo '```'; cat out/versions.txt 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros2-sim-results
          path: out/
