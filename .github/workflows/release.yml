name: Release

# Publishes the distribution with PyPI trusted publishing (OIDC): no token is stored anywhere.
# One-time owner setup, on pypi.org and test.pypi.org: add a "pending publisher" for project
# `robolang`, owner `rokorobot`, repository `RoboLang`, workflow `release.yml`, environment
# `pypi` (PyPI) or `testpypi` (TestPyPI). Then create the two GitHub environments; giving
# `pypi` a required reviewer makes the final upload wait for an explicit approval.
#
# - Run manually with target `testpypi`: build, check, smoke-test, upload to TestPyPI (a rehearsal).
# - Publish a GitHub release whose tag is `v<version>` (for example v0.2.0): the same, then PyPI.
#   A PyPI version can never be uploaded twice, so the tag must match pyproject.toml.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        type: choice
        options: [testpypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: The tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${{ github.event.release.tag_name }}" = "v$version" || {
            echo "::error::tag ${{ github.event.release.tag_name }} does not match version $version"; exit 1; }
      - name: Install smoke test
        run: python tools/smoke_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # The manual rehearsal has already claimed this immutable version.
          # A later GitHub Release must still reach the dependent PyPI job.
          skip-existing: true

  pypi:
    needs: testpypi
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
