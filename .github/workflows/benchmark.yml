name: Benchmark

# The authoring benchmark (docs/STRATEGY.md, section 5).
# - Pull requests that change the language, Core, the bridge, the reference or the benchmark:
#   sets 1 and 2, full prompt, 1 repeat, Sonnet and Haiku only (~$0.40; Opus runs weekly). The scores are posted
#   on the PR; a breached floor in bench/gate.json fails the job (decision rule 2).
# - Weekly (Monday 06:00 UTC) and on demand: sets 1 and 2 with 3 repeats, plus set 2 with the
#   grammar-only prompt for information (~$4-6), plus set 5 (measured values, decision 0036) with both prompts and
#   3 repeats, for information and not gated (~$4, capped at $3 per prompt). Results are kept as an artifact for 90 days.
# - On demand with `set_only: set3`: only set 3 (branching, decision 0027), full and grammar-only prompts,
#   3 repeats each, for information and not gated (~$3-4). Used for the pre-registered 1.3 baseline.
# - On demand with `set_only: set4`: only set 4 (failure handling, decision 0035), full and grammar-only prompts,
#   3 repeats each, for information and not gated; each prompt capped at $10 (`--max-usd`).
# - On demand with `set_only: future`: only set "future" (RSI-01 R3: probes of the atlas's near language gaps), full
#   prompt, 1 repeat, Sonnet and Haiku, capped at $3 (`--max-usd`), for information and not gated. Never run per
#   pull request or weekly.
# - On demand with `set_only: regions`: only set "regions" (decision 0039: region limits; pre-registered against 1.6),
#   full and grammar-only prompts, 3 repeats each, Sonnet and Haiku, each prompt capped at $3 (`--max-usd`), for
#   information and not gated. Never run per pull request or weekly.
# - On demand with `set_only: actions`: only set "actions" (decision 0040: declared actions; pre-registered against 1.7),
#   full and grammar-only prompts, 3 repeats each, Sonnet and Haiku, each prompt capped at $3 (`--max-usd`), for
#   information and not gated. Never run per pull request or weekly.
# - On demand with `set_only: clock`: only set "clock" (decision 0042: clock readings; pre-registered against 1.8),
#   full and grammar-only prompts, 3 repeats each, Sonnet and Haiku, each prompt capped at $3 (`--max-usd`), for
#   information and not gated. Never run per pull request or weekly.
# - On demand with `set_only: missions`: only set "missions" (decision 0041: the mission layer; pre-registered against
#   1.9), full and grammar-only prompts, 3 repeats each, Sonnet and Haiku, each prompt capped at $3 (`--max-usd`), for
#   information and not gated. Never run per pull request or weekly.
# - On demand with `set_only: messages`: only set "messages" (decision 0043: incoming messages; pre-registered against
#   2.0), full and grammar-only prompts, 3 repeats each, Sonnet and Haiku, each prompt capped at $3 (`--max-usd`), for
#   information and not gated. Never run per pull request or weekly.
# - On demand with `set_only: kinds`: only set "kinds" (decision 0044: more measured kinds; pre-registered against
#   2.1), full and grammar-only prompts, 3 repeats each, Sonnet and Haiku, each prompt capped at $3 (`--max-usd`), for
#   information and not gated. Never run per pull request or weekly.
# - On demand with `set_only: choose`: only set "choose" (decision 0045: choosing at run time; pre-registered against
#   2.2), full and grammar-only prompts, 3 repeats each, Sonnet and Haiku, each prompt capped at $3 (`--max-usd`), for
#   information and not gated. Never run per pull request or weekly.
# One string input `set_only` replaces the per-set booleans (GitHub allows at most 10 `workflow_dispatch` inputs):
# its values are set3, set4, future, regions, actions, clock, missions, messages, kinds and choose; empty is the usual weekly or on-demand run.
# Needs the repository secret ANTHROPIC_API_KEY; without it (and on pull requests from forks) the
# job is skipped and nothing is spent.

on:
  pull_request:
    paths:
      - "src/robolang/lexer.py"
      - "src/robolang/tokens.py"
      - "src/robolang/parser.py"
      - "src/robolang/nodes.py"
      - "src/robolang/validator.py"
      - "src/robolang/ir.py"
      - "src/robolang/ir_reader.py"
      - "src/robolang/bridge.py"
      - "src/robolang/export_goal.py"
      - "src/robolang/delegate*.py"
      - "src/robolang/sim/**"
      - "src/robolang/core/**"
      - "src/robolang/reference/**"
      - "spec/grammar*.ebnf"
      - "spec/robolang-v*.md"
      - "docs/language-reference.md"
      - "bench/**"
      - ".github/workflows/benchmark.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      set_only:
        description: "Run only one set, not gated: set3 (branching), set4 (failure handling), future (gap probes), regions, actions, clock, missions, messages, kinds or choose. Empty: the usual run"
        type: string
        default: ""
      confirm_tasks:
        description: "Confirming run (an erratum): comma-separated task IDs; with confirm_set, confirm_models, confirm_prompt; 3 repeats, max $1; not gated"
        type: string
        default: ""
      confirm_set:
        description: "Set of the confirming run"
        type: string
        default: ""
      confirm_models:
        description: "Models of the confirming run"
        type: string
        default: "claude-sonnet-5-5,claude-haiku-5-5"
      confirm_prompt:
        description: "Prompt of the confirming run (full or minimal)"
        type: string
        default: "full"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Is the API key available?
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set: benchmark skipped, nothing spent"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.key.outputs.present == 'true'
        run: python -m pip install -e . -r bench/requirements.txt
      - name: Run (pull request)
        if: steps.key.outputs.present == 'true' && github.event_name == 'pull_request'
        run: |
          python bench/run.py --yes --models claude-sonnet-5-5,claude-haiku-5-5 --run-id set1
          python bench/run.py --yes --models claude-sonnet-5-5,claude-haiku-5-5 --set hard --run-id set2
      - name: Run (set 3, on demand)
        if: steps.key.outputs.present == 'true' && inputs.set_only == 'set3'
        run: |
          python bench/run.py --yes --set branch --repeats 3 --run-id set3
          python bench/run.py --yes --set branch --prompt minimal --repeats 3 --run-id set3-minimal
      - name: Run (set 4, on demand)
        if: steps.key.outputs.present == 'true' && inputs.set_only == 'set4'
        run: |
          python bench/run.py --yes --set failure --repeats 3 --max-usd 10 --run-id set4
          python bench/run.py --yes --set failure --prompt minimal --repeats 3 --max-usd 10 --run-id set4-minimal
      - name: Run (set future, on demand)
        if: steps.key.outputs.present == 'true' && inputs.set_only == 'future'
        run: |
          python bench/run.py --yes --set future --prompt full --repeats 1 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id future
      - name: Run (set regions, on demand)
        if: steps.key.outputs.present == 'true' && inputs.set_only == 'regions'
        run: |
          python bench/run.py --yes --set regions --prompt full --repeats 3 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id regions
          python bench/run.py --yes --set regions --prompt minimal --repeats 3 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id regions-minimal
      - name: Run (set actions, on demand)
        if: steps.key.outputs.present == 'true' && inputs.set_only == 'actions'
        run: |
          python bench/run.py --yes --set actions --prompt full --repeats 3 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id actions
          python bench/run.py --yes --set actions --prompt minimal --repeats 3 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id actions-minimal
      - name: Run (set clock, on demand)
        if: steps.key.outputs.present == 'true' && inputs.set_only == 'clock'
        run: |
          python bench/run.py --yes --set clock --prompt full --repeats 3 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id clock
          python bench/run.py --yes --set clock --prompt minimal --repeats 3 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id clock-minimal
      - name: Run (set missions, on demand)
        if: steps.key.outputs.present == 'true' && inputs.set_only == 'missions'
        run: |
          python bench/run.py --yes --set missions --prompt full --repeats 3 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id missions
          python bench/run.py --yes --set missions --prompt minimal --repeats 3 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id missions-minimal
      - name: Run (set messages, on demand)
        if: steps.key.outputs.present == 'true' && inputs.set_only == 'messages'
        run: |
          python bench/run.py --yes --set messages --prompt full --repeats 3 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id messages
          python bench/run.py --yes --set messages --prompt minimal --repeats 3 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id messages-minimal
      - name: Run (set kinds, on demand)
        if: steps.key.outputs.present == 'true' && inputs.set_only == 'kinds'
        run: |
          python bench/run.py --yes --set kinds --prompt full --repeats 3 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id kinds
          python bench/run.py --yes --set kinds --prompt minimal --repeats 3 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id kinds-minimal
      - name: Run (set choose, on demand)
        if: steps.key.outputs.present == 'true' && inputs.set_only == 'choose'
        run: |
          python bench/run.py --yes --set choose --prompt full --repeats 3 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id choose
          python bench/run.py --yes --set choose --prompt minimal --repeats 3 --models claude-sonnet-5-5,claude-haiku-5-5 --max-usd 3 --run-id choose-minimal
      - name: Run (confirming run, on demand)
        if: steps.key.outputs.present == 'true' && inputs.confirm_tasks != ''
        env:
          CONFIRM_SET: ${{ inputs.confirm_set }}
          CONFIRM_TASKS: ${{ inputs.confirm_tasks }}
          CONFIRM_MODELS: ${{ inputs.confirm_models }}
          CONFIRM_PROMPT: ${{ inputs.confirm_prompt }}
        run: |
          python bench/run.py --yes --set "$CONFIRM_SET" --tasks "$CONFIRM_TASKS" --models "$CONFIRM_MODELS" --prompt "$CONFIRM_PROMPT" --repeats 3 --max-usd 1 --run-id confirm
      - name: Run (weekly or on demand)
        if: steps.key.outputs.present == 'true' && github.event_name != 'pull_request' && inputs.set_only == '' && inputs.confirm_tasks == ''
        run: |
          python bench/run.py --yes --repeats 3 --run-id set1
          python bench/run.py --yes --set hard --repeats 3 --run-id set2
          python bench/run.py --yes --set hard --prompt minimal --repeats 3 --run-id set2-minimal
          python bench/run.py --yes --set values --repeats 3 --max-usd 3 --run-id set5
          python bench/run.py --yes --set values --prompt minimal --repeats 3 --max-usd 3 --run-id set5-minimal
      - name: Keep the raw answers before scoring
        uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: benchmark-answers
          path: bench/results/
          retention-days: 90
      - name: Score and gate
        id: gate
        if: steps.key.outputs.present == 'true'
        timeout-minutes: 25
        run: |
          for dir in bench/results/*/; do echo "scoring $dir"; python bench/score.py "$dir"; done
          if [ -d bench/results/set1 ]; then
            set +e
            python bench/gate.py bench/results/set1 bench/results/set2 --summary summary.md
            echo "code=$?" >> "$GITHUB_OUTPUT"
            set -e
          else
            echo "code=0" >> "$GITHUB_OUTPUT"
            : > summary.md
          fi
          echo "" >> summary.md
          echo "_For information, not gated: Haiku first, Sonnet when escalated (bench/cascade.py)._" >> summary.md
          for dir in bench/results/*/; do
            if python bench/cascade.py "$dir" --summary cascade.md >/dev/null 2>&1; then
              echo "" >> summary.md; cat cascade.md >> summary.md
            fi
          done
          for extra in set3 set3-minimal set4 set4-minimal set5 set5-minimal future regions regions-minimal actions actions-minimal clock clock-minimal missions missions-minimal messages messages-minimal kinds kinds-minimal choose choose-minimal confirm; do
            if [ -d "bench/results/$extra" ]; then
              echo "" >> summary.md
              echo "_For information, not gated: $extra._" >> summary.md
              python bench/gate.py "bench/results/$extra" --summary extra.md || true
              sed -n "/^\\*\\*$extra/,\$p" extra.md >> summary.md
            fi
          done
          if [ -d bench/results/set2-minimal ]; then
            echo "" >> summary.md
            echo "_For information, not gated: the grammar-only prompt._" >> summary.md
            python bench/gate.py bench/results/set2-minimal --summary minimal.md || true
            sed -n '/^\*\*set2-minimal/,$p' minimal.md >> summary.md
          fi
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post the scores on the pull request
        if: steps.key.outputs.present == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: benchmark-results
          path: |
            bench/results/
            summary.md
          retention-days: 90
      - name: Fail on a breached floor
        if: steps.key.outputs.present == 'true' && steps.gate.outputs.code != '0'
        run: |
          echo "::error::The benchmark gate failed: see the job summary (decision rule 2, docs/STRATEGY.md)"
          exit 1
