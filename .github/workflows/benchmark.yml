name: Benchmark

# The authoring benchmark (docs/STRATEGY.md, section 5).
# - Pull requests that change the language, Core, the bridge, the reference or the benchmark:
#   sets 1 and 2, full prompt, 1 repeat (~$1). The scores are posted on the PR; a breached floor in
#   bench/gate.json fails the job (decision rule 2).
# - Weekly (Monday 06:00 UTC) and on demand: sets 1 and 2 with 3 repeats, plus set 2 with the
#   grammar-only prompt for information (~$4-6). Results are kept as an artifact for 90 days.
# Needs the repository secret ANTHROPIC_API_KEY; without it (and on pull requests from forks) the
# job is skipped and nothing is spent.

on:
  pull_request:
    paths:
      - "src/robolang/lexer.py"
      - "src/robolang/tokens.py"
      - "src/robolang/parser.py"
      - "src/robolang/nodes.py"
      - "src/robolang/validator.py"
      - "src/robolang/ir.py"
      - "src/robolang/ir_reader.py"
      - "src/robolang/bridge.py"
      - "src/robolang/export_goal.py"
      - "src/robolang/delegate*.py"
      - "src/robolang/sim/**"
      - "src/robolang/core/**"
      - "src/robolang/reference/**"
      - "spec/grammar*.ebnf"
      - "spec/robolang-v*.md"
      - "docs/language-reference.md"
      - "bench/**"
      - ".github/workflows/benchmark.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Is the API key available?
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set: benchmark skipped, nothing spent"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.key.outputs.present == 'true'
        run: python -m pip install -e . -r bench/requirements.txt
      - name: Run (pull request)
        if: steps.key.outputs.present == 'true' && github.event_name == 'pull_request'
        run: |
          python bench/run.py --yes --run-id set1
          python bench/run.py --yes --set hard --run-id set2
      - name: Run (weekly or on demand)
        if: steps.key.outputs.present == 'true' && github.event_name != 'pull_request'
        run: |
          python bench/run.py --yes --repeats 3 --run-id set1
          python bench/run.py --yes --set hard --repeats 3 --run-id set2
          python bench/run.py --yes --set hard --prompt minimal --repeats 3 --run-id set2-minimal
      - name: Score and gate
        id: gate
        if: steps.key.outputs.present == 'true'
        run: |
          for dir in bench/results/*/; do python bench/score.py "$dir"; done
          set +e
          python bench/gate.py bench/results/set1 bench/results/set2 --summary summary.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e
          if [ -d bench/results/set2-minimal ]; then
            echo "" >> summary.md
            echo "_For information, not gated: the grammar-only prompt._" >> summary.md
            python bench/gate.py bench/results/set2-minimal --summary minimal.md || true
            sed -n '/^\*\*set2-minimal/,$p' minimal.md >> summary.md
          fi
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post the scores on the pull request
        if: steps.key.outputs.present == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: benchmark-results
          path: |
            bench/results/
            summary.md
          retention-days: 90
      - name: Fail on a breached floor
        if: steps.key.outputs.present == 'true' && steps.gate.outputs.code != '0'
        run: |
          echo "::error::The benchmark gate failed: see the job summary (decision rule 2, docs/STRATEGY.md)"
          exit 1
